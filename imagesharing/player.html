<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Video Player</title>
  <style>
    body { background: #121212; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .box { background: #1e1e1e; padding: 25px; border-radius: 8px; width: 100%; max-width: 600px; box-sizing: border-box; }
    input, button { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 4px; }
    button { background: #007acc; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background: #005999; }
    video { width: 100%; margin-top: 15px; display: none; border-radius: 6px; background: #000; }
  </style>
</head>
<body>

  <div class="box">
    <h3 id="videoTitle">🎬 Video Player</h3>
    <p style="font-size: 13px; color: #aaa;" id="fileDisplay"></p>
    
    <input type="password" id="workerPassword" placeholder="Admin Passwort">
    <button onclick="startPlayback()">Video laden & abspielen</button>
    
    <p id="statusMessage" style="font-size: 13px; color: #ccc;"></p>
    
    <video id="videoPlayer" controls></video>
  </div>

  <script>
    // Liest den Dateinamen automatisch aus der URL aus (z. B. ?file=MelinaTheoTown_Final.tar)
    const urlParams = new URLSearchParams(window.location.search);
    const filename = urlParams.get('file');

    if (filename) {
      document.getElementById('fileDisplay').textContent = "Datei: " + filename;
      document.getElementById('videoTitle').textContent = "🎬 " + filename;
    } else {
      document.getElementById('fileDisplay').textContent = "❌ Keine Datei in der URL angegeben!";
      document.getElementById('fileDisplay').style.color = "#ff6b6b";
    }

    // Hilfsfunktion zum Entpacken der MP4 aus dem TAR-Archiv
    async function extractMp4FromTar(tarBlob) {
      const buffer = await tarBlob.arrayBuffer();
      const view = new Uint8Array(buffer);
      let offset = 0;
      
      while (offset < view.length) {
        const header = view.subarray(offset, offset + 512);
        if (header[0] === 0) break;
        
        let name = "";
        for (let i = 0; i < 100; i++) {
          if (header[i] === 0) break;
          name += String.fromCharCode(header[i]);
        }
        
        let sizeStr = "";
        for (let i = 124; i < 136; i++) {
          if (header[i] === 0 || header[i] === 32) continue;
          sizeStr += String.fromCharCode(header[i]);
        }
        const size = parseInt(sizeStr, 8);
        
        offset += 512;
        
        if (name.toLowerCase().endsWith('.mp4') || size > 0) {
          const fileData = view.subarray(offset, offset + size);
          return new Blob([fileData], { type: 'video/mp4' });
        }
        
        const paddedSize = Math.ceil(size / 512) * 512;
        offset += paddedSize;
      }
      
      throw new Error("Keine gültige Videodatei im TAR-Archiv gefunden!");
    }

    async function startPlayback() {
      const password = document.getElementById('workerPassword').value;
      const statusEl = document.getElementById('statusMessage');
      const videoEl = document.getElementById('videoPlayer');
      
      if (!password || !filename) {
        statusEl.textContent = "❌ Bitte Passwort eingeben!";
        statusEl.style.color = "#ff6b6b";
        return;
      }

      statusEl.textContent = "⏳ Starte Download der Chunks...";
      statusEl.style.color = "#ccc";
      videoEl.style.display = "none";

      try {
        const chunks = [];
        let i = 1;

        // Lädt automatisch Teil für Teil durch, bis der Worker 404 (Ende erreicht) meldet
        while (true) {
          statusEl.textContent = `📥 Lade Teil ${i}...`;
          
          const res = await fetch("https://dark-scene-3aef.dssd00598.workers.dev", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              password: password,
              action: "getChunk",
              filename: filename,
              partNumber: i
            })
          });

          // Wenn Teil nicht existiert, sind wir am Ende des Archivs angelangt
          if (res.status === 404) {
            break;
          }

          if (!res.ok) {
            const errData = await res.json().catch(() => ({}));
            throw new Error(errData.message || `Fehler bei Teil ${i} (Status ${res.status})`);
          }
          
          const blob = await res.blob();
          chunks.push(blob);
          i++;
        }

        if (chunks.length === 0) {
          throw new Error("Keine Teile für diese Datei gefunden.");
        }

        statusEl.textContent = "📦 Setze TAR-Archiv zusammen...";
        const tarBlob = new Blob(chunks, { type: "application/octet-stream" });

        statusEl.textContent = "📂 Entpacke Video aus TAR...";
        const videoBlob = await extractMp4FromTar(tarBlob);

        statusEl.textContent = "🎬 Bereite Player vor...";
        videoEl.src = URL.createObjectURL(videoBlob);
        videoEl.style.display = "block";
        videoEl.load();
        
        statusEl.textContent = `✅ Bereit zum Abspielen! (${(videoBlob.size / (1024 * 1024)).toFixed(1)} MB)`;
        statusEl.style.color = "#51cf66";

      } catch (err) {
        statusEl.textContent = "❌ Fehler: " + err.message;
        statusEl.style.color = "#ff6b6b";
      }
    }
  </script>
</body>
</html>
