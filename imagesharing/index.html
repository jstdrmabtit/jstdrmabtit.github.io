<!-- Download-Bereich -->
<div style="background: #1e1e1e; color: #fff; padding: 20px; border-radius: 8px; font-family: sans-serif; max-width: 400px;">
  <h3>Archiv herunterladen</h3>
  <p style="font-size: 14px; color: #aaa;">Gib den Dateinamen und dein Admin-Passwort ein.</p>
  
  <input type="text" id="fileNameInput" value="MelinaTheoTown_Final.tar" placeholder="Dateiname (z.B. archive.tar)" style="width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 4px;">
  
  <input type="password" id="workerPassword" placeholder="Admin Passwort" style="width: 100%; padding: 8px; margin-bottom: 10px; box-sizing: border-box; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 4px;">
  
  <button onclick="startClientDownload()" style="width: 100%; padding: 10px; background: #007acc; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold;">Download starten</button>
  
  <p id="statusMessage" style="margin-top: 10px; font-size: 13px; color: #ccc;"></p>
</div>

<script>
async function startClientDownload() {
  const password = document.getElementById('workerPassword').value;
  const filename = document.getElementById('fileNameInput').value.trim();
  const statusEl = document.getElementById('statusMessage');
  
  if (!password || !filename) {
    statusEl.textContent = "❌ Bitte Passwort und Dateiname eingeben!";
    statusEl.style.color = "#ff6b6b";
    return;
  }

  statusEl.textContent = "⏳ Hole Download-Links vom Worker...";
  statusEl.style.color = "#ccc";

  try {
    // 1. URLs vom Worker anfordern (dynamischer Dateiname)
    const res = await fetch("https://dark-scene-3aef.dssd00598.workers.dev", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        password: password,
        action: "getUrls",
        filename: filename,
        totalParts: 24
      })
    });

    const data = await res.json();
    if (!data.success) {
      statusEl.textContent = "❌ Fehler: " + data.message;
      statusEl.style.color = "#ff6b6b";
      return;
    }

    const chunks = [];
    const total = data.urls.length;

    // 2. Alle Teile nacheinander herunterladen
    for (let i = 0; i < total; i++) {
      statusEl.textContent = `📥 Lade Teil ${i + 1} von ${total}...`;
      
      const chunkRes = await fetch(data.urls[i]);
      if (!chunkRes.ok) {
        throw new Error(`Fehler beim Laden von Teil ${i + 1} (Status ${chunkRes.status})`);
      }
      
      const blob = await chunkRes.blob();
      chunks.push(blob);
    }

    statusEl.textContent = "📦 Setze Archiv zusammen...";
    
    // 3. Im Browser zusammenfügen
    const finalBlob = new Blob(chunks, { type: "application/octet-stream" });
    
    // 4. Download auslösen
    const a = document.createElement("a");
    a.href = URL.createObjectURL(finalBlob);
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

    statusEl.textContent = `✅ Erfolgreich heruntergeladen! (${(finalBlob.size / (1024 * 1024)).toFixed(1)} MB)`;
    statusEl.style.color = "#51cf66";

  } catch (err) {
    statusEl.textContent = "❌ Fehler: " + err.message;
    statusEl.style.color = "#ff6b6b";
  }
}
</script>
