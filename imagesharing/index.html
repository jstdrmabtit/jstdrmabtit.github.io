<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Video Index</title>
  <style>
    body { background: #121212; color: #fff; font-family: sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; }
    .box { background: #1e1e1e; padding: 25px; border-radius: 8px; width: 100%; max-width: 500px; box-sizing: border-box; }
    input, button { width: 100%; padding: 10px; margin-bottom: 10px; box-sizing: border-box; background: #2d2d2d; border: 1px solid #444; color: #fff; border-radius: 4px; }
    button { background: #007acc; border: none; font-weight: bold; cursor: pointer; }
    button:hover { background: #005999; }
    ul { list-style: none; padding: 0; }
    li { margin-bottom: 8px; }
    li a { color: #4dabf7; text-decoration: none; display: block; padding: 8px; background: #252525; border-radius: 4px; }
    li a:hover { background: #333; }
  </style>
</head>
<body>

  <div class="box">
    <h3>📂 Video Index</h3>
    <p style="font-size: 13px; color: #aaa;">Gib dein Passwort ein, um die verfügbaren Videos zu laden:</p>
    
    <input type="password" id="workerPassword" placeholder="Admin Passwort">
    <button onclick="loadVideoList()">Videos anzeigen</button>
    
    <p id="statusMessage" style="font-size: 13px; color: #ccc;"></p>
    
    <!-- Hier landet später die automatische Liste -->
    <ul id="videoList"></ul>
  </div>

  <script>
    async function loadVideoList() {
      const password = document.getElementById('workerPassword').value;
      const statusEl = document.getElementById('statusMessage');
      const listEl = document.getElementById('videoList');
      
      if (!password) {
        statusEl.textContent = "❌ Bitte Passwort eingeben!";
        statusEl.style.color = "#ff6b6b";
        return;
      }

      statusEl.textContent = "⏳ Lade Video-Liste...";
      statusEl.style.color = "#ccc";
      listEl.innerHTML = "";

      try {
        const res = await fetch("https://dark-scene-3aef.dssd00598.workers.dev", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ password: password, action: "listVideos" })
        });

        const data = await res.json();
        if (!data.success) {
          throw new Error(data.message);
        }

        if (data.videos.length === 0) {
          statusEl.textContent = "📭 Keine Videos gefunden.";
          return;
        }

        statusEl.textContent = `✅ ${data.videos.length} Video(s) gefunden:`;
        statusEl.style.color = "#51cf66";

        // Automatisch für jedes gefundene Video einen Listeneintrag generieren
        data.videos.forEach(videoName => {
          const li = document.createElement('li');
          const a = document.createElement('a');
          a.href = `player.html?file=${encodeURIComponent(videoName)}`; // Verlinkt auf deine Player-Seite
          a.textContent = `🎬 ${videoName}`;
          li.appendChild(a);
          listEl.appendChild(li);
        });

      } catch (err) {
        statusEl.textContent = "❌ Fehler: " + err.message;
        statusEl.style.color = "#ff6b6b";
      }
    }
  </script>
</body>
</html>
