<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Praktikumskalender Bearbeiten</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --heading: #f0f6fc;
      --primary: #238636;
      --primary-hover: #2ea043;
      --danger: #da3633;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 1100px;
      width: 100%;
    }

    h1 { color: var(--heading); margin-bottom: 0.5rem; }
    p.subtitle { color: #8b949e; margin-bottom: 2rem; }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--heading);
      font-size: 0.9rem;
    }

    input, select {
      width: 100%;
      padding: 0.5rem;
      background-color: #010409;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      box-sizing: border-box;
      font-size: 0.9rem;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #58a6ff;
    }

    .table-container {
      overflow-x: auto;
      margin-bottom: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 0.5rem;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    th {
      background-color: #21262d;
      color: var(--heading);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
    }

    .btn:hover { background-color: var(--primary-hover); }

    .btn-danger {
      background-color: var(--danger);
      padding: 0.4rem 0.8rem;
      font-size: 0.8rem;
      width: auto;
    }

    .btn-add {
      background-color: #21262d;
      border: 1px solid var(--border);
      color: var(--text);
      margin-bottom: 1rem;
      width: auto;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Praktikums-Verwaltung</h1>
    <p class="subtitle">Verwalte deine Schulwochen, Daten und den Belegungsstatus über Cloudflare.</p>

    <div class="card">
      <div class="form-group">
        <label for="pat">Admin-Passwort:</label>
        <input type="password" id="pat" placeholder="Admin-Passwort eingeben...">
      </div>
    </div>

    <div class="card">
      <h2>Terminübersicht</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th style="width: 10%;">SW</th>
              <th style="width: 10%;">KW</th>
              <th style="width: 30%;">VON – BIS</th>
              <th style="width: 20%;">STATUS</th>
              <th style="width: 20%;">BETRIEB / EINRICHTUNG</th>
              <th style="width: 10%;">AKTION</th>
            </tr>
          </thead>
          <tbody id="admin-table-body">
            <tr>
              <td colspan="6" style="text-align: center; padding: 2rem;">Lade Daten...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <button class="btn btn-add" onclick="addRow()">+ Neuen Termin hinzufügen</button>
      <button class="btn" id="save-btn" onclick="saveData()">Änderungen Speichern</button>
    </div>
  </div>

  <script>
    const REPO_URL = "https://api.github.com/repos/jstdrmabtit/jstdrmabtit.github.io/contents/_data/meinedaten.yml";
    const WORKER_URL = "https://dark-scene-3aef.dssd00598.workers.dev";

    let rawLegende = [];
    let termineData = [];

    function decodeBase64UTF8(str) {
      return new TextDecoder().decode(Uint8Array.from(atob(str.replace(/\s/g, '')), c => c.charCodeAt(0)));
    }

    function parseYAML(yamlString) {
      const lines = yamlString.split('\n');
      let legende = [];
      let termine = [];
      let currentSection = null;
      let currentItem = null;

      for (let line of lines) {
        const trimmed = line.trim();
        if (!trimmed || trimmed.startsWith('#')) continue;

        if (trimmed === 'legende:') {
          currentSection = 'legende';
          continue;
        } else if (trimmed === 'termine:') {
          if (currentItem && currentSection === 'legende') legende.push(currentItem);
          currentSection = 'termine';
          currentItem = null;
          continue;
        }

        if (trimmed.startsWith('- ')) {
          if (currentItem) {
            if (currentSection === 'legende') legende.push(currentItem);
            if (currentSection === 'termine') termine.push(currentItem);
          }
          currentItem = {};
          const firstProp = trimmed.substring(2).split(':');
          if (firstProp.length >= 2) {
            const key = firstProp[0].trim();
            const val = firstProp.slice(1).join(':').trim().replace(/^["']|["']$/g, '');
            currentItem[key] = val;
          }
        } else if (currentItem && trimmed.includes(':')) {
          const parts = trimmed.split(':');
          const key = parts[0].trim();
          const val = parts.slice(1).join(':').trim().replace(/^["']|["']$/g, '');
          currentItem[key] = val;
        }
      }

      if (currentItem) {
        if (currentSection === 'legende') legende.push(currentItem);
        if (currentSection === 'termine') termine.push(currentItem);
      }

      return { legende, termine };
    }

    async function loadData() {
      try {
        const res = await fetch(`${REPO_URL}?t=${Date.now()}`);
        if (!res.ok) throw new Error("Netzwerkfehler beim Laden der Datei.");

        const data = await res.json();
        const yamlText = decodeBase64UTF8(data.content);
        
        const parsed = parseYAML(yamlText);
        rawLegende = parsed.legende;
        termineData = parsed.termine;

        renderTable();
      } catch (err) {
        alert("Fehler beim Laden der Daten: " + err.message);
      }
    }

    function renderTable() {
      const tbody = document.getElementById('admin-table-body');
      tbody.innerHTML = termineData.map((t, index) => `
        <tr>
          <td><input type="text" value="${escapeHtml(t.sw || '')}" onchange="updateData(${index}, 'sw', this.value)"></td>
          <td><input type="text" value="${escapeHtml(t.kw || '')}" onchange="updateData(${index}, 'kw', this.value)"></td>
          <td>
            <div style="display: flex; gap: 0.3rem; align-items: center;">
              <input type="text" value="${escapeHtml(t.von || '')}" onchange="updateData(${index}, 'von', this.value)">
              <span>-</span>
              <input type="text" value="${escapeHtml(t.bis || '')}" onchange="updateData(${index}, 'bis', this.value)">
            </div>
          </td>
          <td>
            <select onchange="updateData(${index}, 'status', this.value)">
              <option value="frei" ${t.status === 'frei' ? 'selected' : ''}>frei</option>
              <option value="belegt" ${t.status === 'belegt' ? 'selected' : ''}>belegt</option>
              <option value="vorgemerkt" ${t.status === 'vorgemerkt' ? 'selected' : ''}>vorgemerkt</option>
            </select>
          </td>
          <td><input type="text" value="${escapeHtml(t.betrieb || '')}" onchange="updateData(${index}, 'betrieb', this.value)"></td>
          <td><button class="btn btn-danger" onclick="deleteRow(${index})">Löschen</button></td>
        </tr>
      `).join('');
    }

    function escapeHtml(str) {
      return String(str).replace(/"/g, '&quot;');
    }

    function updateData(index, field, value) {
      termineData[index][field] = value;
    }

    function addRow() {
      termineData.push({ sw: 'SW X', kw: 'KW X', von: '01.01.2026', bis: '05.01.2026', status: 'frei', betrieb: '' });
      renderTable();
    }

    function deleteRow(index) {
      termineData.splice(index, 1);
      renderTable();
    }

    function generateYAML() {
      let yaml = "legende:\n";
      rawLegende.forEach(item => {
        yaml += `  - farbe: "${item.farbe || ''}"\n`;
        yaml += `    label: "${item.label || ''}"\n`;
        yaml += `    status: "${item.status || ''}"\n`;
      });

      yaml += "\ntermine:\n";
      termineData.forEach(item => {
        yaml += `  - sw: "${item.sw || ''}"\n`;
        yaml += `    kw: "${item.kw || ''}"\n`;
        yaml += `    von: "${item.von || ''}"\n`;
        yaml += `    bis: "${item.bis || ''}"\n`;
        yaml += `    betrieb: "${item.betrieb || ''}"\n`;
        yaml += `    status: "${item.status || 'frei'}"\n`;
      });

      return yaml;
    }

    async function saveData() {
      const password = document.getElementById('pat').value.trim();
      if (!password) {
        alert("Bitte gib dein Admin-Passwort ein!");
        return;
      }

      const btn = document.getElementById('save-btn');
      btn.disabled = true;
      btn.textContent = "Speichere...";

      const yamlContent = generateYAML();

      try {
        const shaRes = await fetch(`${REPO_URL}?t=${Date.now()}`);
        if (!shaRes.ok) throw new Error("Konnte Datei-SHA nicht von GitHub abrufen.");
        
        const shaData = await shaRes.json();
        const currentSha = shaData.sha;

        const res = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            password: password,
            content: yamlContent,
            sha: currentSha
          })
        });

        if (res.ok) {
          alert("Erfolgreich gespeichert!");
          loadData();
        } else {
          const errText = await res.text();
          alert("Fehler beim Speichern: " + errText);
        }
      } catch (err) {
        alert("Fehler: " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Änderungen Speichern";
      }
    }

    loadData();
  </script>
</body>
</html>
