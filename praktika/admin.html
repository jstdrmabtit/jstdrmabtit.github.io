<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Praktikumskalender Bearbeiten</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --heading: #f0f6fc;
      --primary: #238636;
      --primary-hover: #2ea043;
      --danger: #da3633;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 1100px;
      width: 100%;
    }

    h1 { color: var(--heading); margin-bottom: 0.5rem; }
    p.subtitle { color: #8b949e; margin-bottom: 2rem; }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .form-group {
      margin-bottom: 1rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      color: var(--heading);
      font-size: 0.9rem;
    }

    input, select {
      width: 100%;
      padding: 0.5rem;
      background-color: #010409;
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      box-sizing: border-box;
      font-size: 0.9rem;
    }

    input:focus, select:focus {
      outline: none;
      border-color: #58a6ff;
    }

    .table-container {
      overflow-x: auto;
      margin-bottom: 1rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 0.5rem;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    th {
      background-color: #21262d;
      color: var(--heading);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .btn {
      background-color: var(--primary);
      color: white;
      border: none;
      padding: 0.6rem 1.2rem;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
    }

    .btn:hover { background-color: var(--primary-hover); }

    .btn-danger {
      background-color: var(--danger);
      padding: 0.4rem 0.8rem;
      font-size: 0.8rem;
      width: auto;
    }

    .btn-add {
      background-color: #21262d;
      border: 1px solid var(--border);
      color: var(--text);
      margin-bottom: 1rem;
      width: auto;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Praktikums-Verwaltung</h1>
    <p class="subtitle">Verwalte deine Schulwochen, Daten und den Belegungsstatus über Cloudflare.</p>

    <div class="card">
      <div class="form-group">
        <label for="pat">Admin-Passwort:</label>
        <input type="password" id="pat" placeholder="Admin-Passwort eingeben...">
      </div>
    </div>

    <div class="card">
      <h2>Terminübersicht</h2>
      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th style="width: 10%;">SW</th>
              <th style="width: 10%;">KW</th>
              <th style="width: 30%;">VON – BIS</th>
              <th style="width: 20%;">STATUS</th>
              <th style="width: 20%;">BETRIEB / EINRICHTUNG</th>
              <th style="width: 10%;">AKTION</th>
            </tr>
          </thead>
          <tbody id="admin-table-body">
            <tr>
              <td colspan="6" style="text-align: center; padding: 2rem;">Lade Daten...</td>
            </tr>
          </tbody>
        </table>
      </div>

      <button class="btn btn-add" onclick="addRow()">+ Neuen Termin hinzufügen</button>
      <button class="btn" id="save-btn" onclick="saveData()">Änderungen Speichern</button>
    </div>
  </div>

  <script>
    let rawLegende = [];
    let termineData = [];

    function parseYAML(yamlString) {
      if (!yamlString || !yamlString.trim()) return { legende: [], termine: [] };

      const lines = yamlString.replace(/\r\n/g, '\n').split('\n');
      let legende = [];
      let termine = [];
      let currentSection = null;
      let currentItem = null;

      for (let line of lines) {
        const trimmed = line.trim();
        if (!trimmed || trimmed.startsWith('#')) continue;

        if (trimmed === 'legende:') {
          if (currentItem && currentSection) {
            if (currentSection === 'legende') legende.push(currentItem);
            if (currentSection === 'termine') termine.push(currentItem);
            currentItem = null;
          }
          currentSection = 'legende';
          continue;
        } else if (trimmed === 'termine:') {
          if (currentItem && currentSection) {
            if (currentSection === 'legende') legende.push(currentItem);
            if (currentSection === 'termine') termine.push(currentItem);
            currentItem = null;
          }
          currentSection = 'termine';
          continue;
        }

        if (trimmed.startsWith('- ')) {
          if (currentItem && currentSection) {
            if (currentSection === 'legende') legende.push(currentItem);
            if (currentSection === 'termine') termine.push(currentItem);
          }
          currentItem = {};
          const rest = trimmed.substring(2).trim();
          const colonIdx = rest.indexOf(':');
          if (colonIdx !== -1) {
            const key = rest.substring(0, colonIdx).trim();
            const val = rest.substring(colonIdx + 1).trim().replace(/^["']|["']$/g, '');
            currentItem[key] = val;
          }
        } else if (currentItem && trimmed.includes(':')) {
          const colonIdx = trimmed.indexOf(':');
          const key = trimmed.substring(0, colonIdx).trim();
          const val = trimmed.substring(colonIdx + 1).trim().replace(/^["']|["']$/g, '');
          currentItem[key] = val;
        }
      }

      if (currentItem && currentSection) {
        if (currentSection === 'legende') legende.push(currentItem);
        if (currentSection === 'termine') termine.push(currentItem);
      }

      return { legende, termine };
    }

async function loadData() {
  const tbody = document.getElementById('admin-table-body');
  try {
    const res = await fetch("https://raw.githubusercontent.com/jstdrmabtit/jstdrmabtit.github.io/main/_data/meinedaten.yml?nocache=" + Math.random().toString(36).substring(7));
    if (!res.ok) throw new Error("HTTP-Fehler " + res.status);

    const yamlText = await res.text();
    const parsed = parseYAML(yamlText);

    rawLegende = parsed.legende;
    termineData = parsed.termine;

    if (termineData.length === 0) {
      tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 2rem;">Keine Termine im YAML gefunden. Klicke auf "+ Neuen Termin hinzufügen".</td></tr>`;
    } else {
      renderTable();
    }
  } catch (err) {
    tbody.innerHTML = `<tr><td colspan="6" style="text-align: center; color: var(--danger); padding: 2rem;">Fehler: ${err.message}</td></tr>`;
  }
}

    function renderTable() {
      const tbody = document.getElementById('admin-table-body');
      tbody.innerHTML = termineData.map((t, index) => `
        <tr>
          <td><input type="text" value="${escapeHtml(t.sw || '')}" onchange="updateData(${index}, 'sw', this.value)"></td>
          <td><input type="text" value="${escapeHtml(t.kw || '')}" onchange="updateData(${index}, 'kw', this.value)"></td>
          <td>
            <div style="display: flex; gap: 0.3rem; align-items: center;">
              <input type="text" value="${escapeHtml(t.von || '')}" onchange="updateData(${index}, 'von', this.value)">
              <span>-</span>
              <input type="text" value="${escapeHtml(t.bis || '')}" onchange="updateData(${index}, 'bis', this.value)">
            </div>
          </td>
          <td>
            <select onchange="updateData(${index}, 'status', this.value)">
              <option value="frei" ${t.status === 'frei' ? 'selected' : ''}>frei</option>
              <option value="belegt" ${t.status === 'belegt' ? 'selected' : ''}>belegt</option>
              <option value="vorgemerkt" ${t.status === 'vorgemerkt' ? 'selected' : ''}>vorgemerkt</option>
            </select>
          </td>
          <td><input type="text" value="${escapeHtml(t.betrieb || '')}" onchange="updateData(${index}, 'betrieb', this.value)"></td>
          <td><button class="btn btn-danger" onclick="deleteRow(${index})">Löschen</button></td>
        </tr>
      `).join('');
    }

    function escapeHtml(str) {
      return String(str).replace(/"/g, '&quot;');
    }

    function updateData(index, field, value) {
      termineData[index][field] = value;
    }

    function addRow() {
      termineData.push({ sw: 'SW X', kw: 'KW X', von: '01.01.2026', bis: '05.01.2026', status: 'frei', betrieb: '' });
      renderTable();
    }

    function deleteRow(index) {
      termineData.splice(index, 1);
      if (termineData.length === 0) {
        document.getElementById('admin-table-body').innerHTML = `<tr><td colspan="6" style="text-align: center; padding: 2rem;">Keine Termine im YAML gefunden. Klicke auf "+ Neuen Termin hinzufügen".</td></tr>`;
      } else {
        renderTable();
      }
    }

    function generateYAML() {
      let yaml = "legende:\n";
      if (rawLegende.length > 0) {
        rawLegende.forEach(item => {
          yaml += `  - farbe: "${item.farbe || ''}"\n`;
          yaml += `    label: "${item.label || ''}"\n`;
          yaml += `    status: "${item.status || ''}"\n`;
        });
      } else {
        yaml += `  - farbe: "#238636"\n    label: "Frei"\n    status: "frei"\n`;
        yaml += `  - farbe: "#da3633"\n    label: "Belegt"\n    status: "belegt"\n`;
        yaml += `  - farbe: "#d29922"\n    label: "Vorgemerkt"\n    status: "vorgemerkt"\n`;
      }

      yaml += "\ntermine:\n";
      termineData.forEach(item => {
        yaml += `  - sw: "${item.sw || ''}"\n`;
        yaml += `    kw: "${item.kw || ''}"\n`;
        yaml += `    von: "${item.von || ''}"\n`;
        yaml += `    bis: "${item.bis || ''}"\n`;
        yaml += `    betrieb: "${item.betrieb || ''}"\n`;
        yaml += `    status: "${item.status || 'frei'}"\n`;
      });

      return yaml;
    }

    async function saveData() {
      const password = document.getElementById('pat').value.trim();
      if (!password) {
        alert("Bitte gib dein Admin-Passwort ein!");
        return;
      }

      if (termineData.length === 0) {
        alert("Bitte füge mindestens einen Termin hinzu, bevor du speicherst.");
        return;
      }

      const btn = document.getElementById('save-btn');
      btn.disabled = true;
      btn.textContent = "Speichere...";

      const yamlContent = generateYAML();

      try {
        const res = await fetch("https://dark-scene-3aef.dssd00598.workers.dev", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            password: password,
            content: yamlContent
          })
        });

        if (res.ok) {
          alert("Erfolgreich gespeichert!");
          loadData();
        } else {
          const errText = await res.text();
          alert("Fehler beim Speichern: " + errText);
        }
      } catch (err) {
        alert("Fehler: " + err.message);
      } finally {
        btn.disabled = false;
        btn.textContent = "Änderungen Speichern";
      }
    }

    loadData();
  </script>
</body>
</html>
