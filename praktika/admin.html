<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - Termine Bearbeiten</title>
  <style>
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #0d1117; color: #c9d1d9; max-width: 700px; margin: 40px auto; padding: 20px; }
    input, textarea, button { width: 100%; margin-bottom: 15px; padding: 10px; border-radius: 6px; border: 1px solid #30363d; background: #161b22; color: #fff; box-sizing: border-box; }
    button { background: #238636; font-size: 1rem; font-weight: bold; cursor: pointer; border: none; padding: 12px; }
    button:hover { background: #2ea44f; }
    textarea { font-family: monospace; height: 320px; font-size: 0.9rem; line-height: 1.4; }
    .status { padding: 12px; border-radius: 6px; display: none; margin-bottom: 15px; font-weight: bold; }
    .success { background: rgba(46,164,79,0.2); color: #3fb950; border: 1px solid rgba(46,164,79,0.4); }
    .error { background: rgba(248,81,73,0.2); color: #f85149; border: 1px solid rgba(248,81,73,0.4); }
  </style>
</head>
<body>

  <h1>Admin Interface</h1>
  
  <div id="statusBox" class="status"></div>

  <label>Passwort:</label>
  <input type="password" id="password" placeholder="Passwort eingeben...">

  <label>YAML Daten (_data/meinedaten.yml):</label>
  <textarea id="yamlContent" placeholder="Lade Daten..."></textarea>

  <button onclick="saveData()">Änderungen Speichern</button>

  <script>
    const WORKER_URL = "https://dark-scene-3aef.dssd00598.workers.dev";
    let currentSha = "";

    async function loadData() {
      try {
        const res = await fetch("https://api.github.com/repos/jstdrmabtit/jstdrmabtit.github.io/contents/_data/meinedaten.yml");
        const data = await res.json();
        currentSha = data.sha;
        document.getElementById("yamlContent").value = decodeURIComponent(escape(atob(data.content)));
      } catch (err) {
        alert("Fehler beim Laden der YAML-Daten: " + err.message);
      }
    }

    async function saveData() {
      const password = document.getElementById("password").value;
      const updatedYamlContent = document.getElementById("yamlContent").value;
      const statusBox = document.getElementById("statusBox");

      if (!password) {
        alert("Bitte gib dein Passwort ein!");
        return;
      }

      statusBox.style.display = "block";
      statusBox.className = "status";
      statusBox.innerText = "Speichere auf GitHub...";

      try {
        const response = await fetch(WORKER_URL, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            password: password,
            updatedYamlContent: updatedYamlContent,
            sha: currentSha
          })
        });

        const result = await response.json();

        if (response.ok) {
          statusBox.className = "status success";
          statusBox.innerText = "Erfolgreich gespeichert! GitHub aktualisiert die Seite...";
          loadData();
        } else {
          statusBox.className = "status error";
          statusBox.innerText = "Fehler: " + (result.error || "Unbekannter Fehler");
        }
      } catch (err) {
        statusBox.className = "status error";
        statusBox.innerText = "Verbindungsfehler: " + err.message;
      }
    }

    loadData();
  </script>
</body>
</html>
