<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Praktikumskalender - Übersicht</title>
  <style>
    :root {
      --bg: #0d1117;
      --card: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --status-frei-bg: rgba(46, 164, 79, 0.2);
      --status-frei-text: #3fb950;
      --status-frei-border: #238636;
      --status-belegt-bg: rgba(248, 81, 73, 0.2);
      --status-belegt-text: #f85149;
      --status-belegt-border: #da3633;
      --status-vorgemerkt-bg: rgba(210, 153, 34, 0.2);
      --status-vorgemerkt-text: #d29922;
      --status-vorgemerkt-border: #9e6a03;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: var(--bg);
      color: var(--text);
      max-width: 1000px;
      margin: 30px auto;
      padding: 0 20px 50px 20px;
    }

    h1 { margin-bottom: 5px; }
    p.subtitle { color: #8b949e; margin-bottom: 25px; }

    .card {
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 20px;
      margin-bottom: 20px;
    }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 12px;
      border-bottom: 1px solid var(--border);
    }

    th {
      background: #21262d;
      color: #8b949e;
      font-size: 0.85rem;
      text-transform: uppercase;
    }

    .badge {
      display: inline-block;
      padding: 4px 12px;
      border-radius: 20px;
      font-weight: bold;
      font-size: 0.85rem;
    }

    .badge-frei { background: var(--status-frei-bg); color: var(--status-frei-text); border: 1px solid var(--status-frei-border); }
    .badge-belegt { background: var(--status-belegt-bg); color: var(--status-belegt-text); border: 1px solid var(--status-belegt-border); }
    .badge-vorgemerkt { background: var(--status-vorgemerkt-bg); color: var(--status-vorgemerkt-text); border: 1px solid var(--status-vorgemerkt-border); }

    .legende-container {
      display: flex;
      gap: 15px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .legende-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.9rem;
    }

    .legende-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
    }
  </style>
</head>
<body>

  <h1>Praktikumskalender</h1>
  <p class="subtitle">Aktuelle Übersicht der Schulwochen und Praktikumszeiten.</p>

  <div class="legende-container" id="legendeBox"></div>

  <div class="card">
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>SW</th>
            <th>KW</th>
            <th>Zeitraum</th>
            <th>Status</th>
            <th>Betrieb / Einrichtung</th>
          </tr>
        </thead>
        <tbody id="kalenderBody">
          <tr><td colspan="5" style="text-align:center;">Lade aktuelle Daten...</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
  let lastSha = ""; // Speichert den aktuellen Stand der Datei

  function parseYAML(text) {
    const lines = text.split('\n');
    let inTermine = false;
    let inLegende = false;
    let termine = [];
    let legende = [];
    let currentItem = null;

    lines.forEach(line => {
      const trimmed = line.trim();
      if (!trimmed) return;

      if (trimmed.startsWith('legende:')) { 
        inLegende = true; 
        inTermine = false; 
        return; 
      }
      if (trimmed.startsWith('termine:')) { 
        if (currentItem && inLegende) legende.push(currentItem);
        inTermine = true; 
        inLegende = false; 
        currentItem = null;
        return; 
      }

      if (trimmed.startsWith('- ')) {
        if (currentItem) {
          if (inLegende) legende.push(currentItem);
          if (inTermine) termine.push(currentItem);
        }
        currentItem = {};
      }

      if (currentItem && trimmed.includes(':')) {
        const parts = trimmed.replace(/^- /, '').split(':');
        const key = parts[0].trim();
        let val = parts.slice(1).join(':').trim().replace(/^["']|["']$/g, '');
        currentItem[key] = val;
      }
    });

    if (currentItem) {
      if (inLegende) legende.push(currentItem);
      if (inTermine) termine.push(currentItem);
    }

    return { legende, termine };
  }

async function loadLiveData() {
  try {
    const res = await fetch("https://api.github.com/repos/jstdrmabtit/jstdrmabtit.github.io/contents/_data/meinedaten.yml?timestamp=" + new Date().getTime());
    const data = await res.json();
    
    if (!res.ok || !data.content) return;

    if (data.sha !== lastSha) {
      lastSha = data.sha;
      
      const cleanedBase64 = data.content.replace(/\s/g, '');
      const bytes = Uint8Array.from(atob(cleanedBase64), c => c.charCodeAt(0));
      const yamlText = new TextDecoder('utf-8').decode(bytes);

      const parsed = parseYAML(yamlText);
      renderPage(parsed.legende, parsed.termine);
    }
  } catch (err) {
    console.error("Fehler beim automatischen Aktualisieren:", err);
  }
}

  function renderPage(legende, termine) {
    // Legende rendern
    const legendeBox = document.getElementById("legendeBox");
    if (legendeBox) {
      legendeBox.innerHTML = "";
      legende.forEach(item => {
        const div = document.createElement("div");
        div.className = "legende-item";
        div.innerHTML = `<span class="legende-dot" style="background-color: ${item.farbe}"></span> ${item.label}`;
        legendeBox.appendChild(div);
      });
    }

    // Tabelle rendern
    const tbody = document.getElementById("kalenderBody");
    tbody.innerHTML = "";

    termine.forEach(item => {
      const tr = document.createElement("tr");

      let statusBadge = "";
      if (item.status === "frei") statusBadge = '<span class="badge badge-frei">Frei / Verfügbar</span>';
      else if (item.status === "belegt") statusBadge = '<span class="badge badge-belegt">Belegt</span>';
      else if (item.status === "vorgemerkt") statusBadge = '<span class="badge badge-vorgemerkt">Vorgemerkt</span>';

      tr.innerHTML = `
        <td><strong>${item.sw || ''}</strong></td>
        <td>${item.kw || ''}</td>
        <td>${item.von || ''} – ${item.bis || ''}</td>
        <td>${statusBadge}</td>
        <td>${item.betrieb || '—'}</td>
      `;

      tbody.appendChild(tr);
    });
  }

  // Erster Aufruf beim Laden der Seite
  loadLiveData();

  // Automatische Aktualisierung alle 5 Sekunden (5000ms)
  setInterval(loadLiveData, 5000);
</script>
</body>
</html>
