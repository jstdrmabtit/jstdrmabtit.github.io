<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Praktikumskalender - Übersicht</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --heading: #f0f6fc;
      --status-frei: #238636;
      --status-belegt: #da3633;
      --status-vorgemerkt: #d29922;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 1000px;
      width: 100%;
    }

    h1 { color: var(--heading); margin-bottom: 0.5rem; }
    p.subtitle { color: #8b949e; margin-bottom: 2rem; }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.5rem;
      margin-bottom: 1.5rem;
    }

    .legend-container {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
    }

    .badge-dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .dot-frei { background-color: var(--status-frei); }
    .dot-belegt { background-color: var(--status-belegt); }
    .dot-vorgemerkt { background-color: var(--status-vorgemerkt); }

    .table-container {
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
    }

    th, td {
      padding: 0.8rem;
      border-bottom: 1px solid var(--border);
      text-align: left;
    }

    th {
      background-color: #21262d;
      color: var(--heading);
      font-size: 0.85rem;
      font-weight: 600;
    }

    .badge {
      padding: 0.25rem 0.6rem;
      border-radius: 12px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: capitalize;
      color: white;
      display: inline-block;
    }

    .status-frei { background-color: var(--status-frei); }
    .status-belegt { background-color: var(--status-belegt); }
    .status-vorgemerkt { background-color: var(--status-vorgemerkt); }
  </style>
</head>
<body>

  <div class="container">
    <h1>Praktikumskalender</h1>
    <p class="subtitle">Übersicht der Verfügbarkeiten und Termine.</p>

    <div class="card">
      <div class="legend-container">
        <div class="legend-item"><span class="badge-dot dot-frei"></span> Frei</div>
        <div class="legend-item"><span class="badge-dot dot-vorgemerkt"></span> Vorgemerkt</div>
        <div class="legend-item"><span class="badge-dot dot-belegt"></span> Belegt</div>
      </div>

      <div class="table-container">
        <table>
          <thead>
            <tr>
              <th>Schulwoche / KW</th>
              <th>Zeitraum (Von - Bis)</th>
              <th>Status</th>
              <th>Betrieb / Einrichtung</th>
            </tr>
          </thead>
          <tbody id="kalender-body">
            <tr>
              <td colspan="4" style="text-align: center; padding: 2rem;">Lade Kalenderdaten...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    function parseYAML(yamlString) {
      if (!yamlString || !yamlString.trim()) return { termine: [] };
      const lines = yamlString.replace(/\r\n/g, '\n').split('\n');
      let termine = [];
      let currentSection = null;
      let currentItem = null;

      for (let line of lines) {
        const trimmed = line.trim();
        if (!trimmed || trimmed.startsWith('#')) continue;

        if (trimmed === 'termine:') {
          if (currentItem && currentSection === 'termine') termine.push(currentItem);
          currentSection = 'termine';
          currentItem = null;
          continue;
        } else if (trimmed === 'legende:') {
          if (currentItem && currentSection === 'termine') termine.push(currentItem);
          currentSection = 'legende';
          currentItem = null;
          continue;
        }

        if (currentSection === 'termine') {
          if (trimmed.startsWith('- ')) {
            if (currentItem) termine.push(currentItem);
            currentItem = {};
            const rest = trimmed.substring(2).trim();
            const colonIdx = rest.indexOf(':');
            if (colonIdx !== -1) {
              const key = rest.substring(0, colonIdx).trim();
              const val = rest.substring(colonIdx + 1).trim().replace(/^["']|["']$/g, '');
              currentItem[key] = val;
            }
          } else if (currentItem && trimmed.includes(':')) {
            const colonIdx = trimmed.indexOf(':');
            const key = trimmed.substring(0, colonIdx).trim();
            const val = trimmed.substring(colonIdx + 1).trim().replace(/^["']|["']$/g, '');
            currentItem[key] = val;
          }
        }
      }
      if (currentItem && currentSection === 'termine') termine.push(currentItem);
      return { termine };
    }

    async function loadFrontendData() {
  const tbody = document.getElementById('kalender-body');
  try {
 const res = await fetch("https://dark-scene-3aef.dssd00598.workers.dev");
    
    if (!res.ok) throw new Error("HTTP Fehler " + res.status);

    const text = await res.text();
    const parsed = parseYAML(text);

    if (!parsed.termine || parsed.termine.length === 0) {
      tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; padding: 2rem;">Keine Termine vorhanden.</td></tr>`;
      return;
    }

        tbody.innerHTML = parsed.termine.map(t => {
          const statusClass = t.status ? t.status.toLowerCase() : 'frei';
          return `
            <tr>
              <td><strong>${t.sw || ''}</strong> (${t.kw || ''})</td>
              <td>${t.von || ''} – ${t.bis || ''}</td>
              <td><span class="badge status-${statusClass}">${t.status || 'frei'}</span></td>
              <td>${t.betrieb || '-'}</td>
            </tr>
          `;
        }).join('');

      } catch (err) {
        console.error("Fehler beim Laden:", err);
        tbody.innerHTML = `<tr><td colspan="4" style="text-align: center; color: var(--status-belegt); padding: 2rem;">Fehler beim Laden der Daten.</td></tr>`;
      }
    }

    //here
    
    let fetchInterval = null;
    let backgroundTimer = null;
    const REFRESH_INTERVAL_MS = 10000;
    const BACKGROUND_TIMEOUT_MS = 30000;

    function startAutoRefresh() {
      if (!fetchInterval) {
        fetchInterval = setInterval(loadFrontendData, REFRESH_INTERVAL_MS);
      }
    }

    function stopAutoRefresh() {
      if (fetchInterval) {
        clearInterval(fetchInterval);
        fetchInterval = null;
      }
    }

    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        backgroundTimer = setTimeout(() => {
      stopAutoRefresh();
        }, BACKGROUND_TIMEOUT_MS);
      } else {
        if (backgroundTimer) {
          clearTimeout(backgroundTimer);
          backgroundTimer = null;
        }
        loadFrontendData();
        startAutoRefresh();
      }
    });

loadFrontendData();
startAutoRefresh();
  </script>
</body>
</html>
