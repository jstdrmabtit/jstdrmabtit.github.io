<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Praktikumskalender - Übersicht</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --heading: #f0f6fc;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 900px;
      width: 100%;
    }

    h1 {
      color: var(--heading);
      margin-bottom: 0.5rem;
    }

    p.subtitle {
      color: #8b949e;
      margin-bottom: 2rem;
    }

    .legend-container {
      display: flex;
      gap: 1.5rem;
      margin-bottom: 1.5rem;
      flex-wrap: wrap;
      background: var(--card-bg);
      padding: 1rem;
      border-radius: 6px;
      border: 1px solid var(--border);
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
    }

    .dot {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
    }

    .table-container {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 0.75rem 1rem;
      border-bottom: 1px solid var(--border);
    }

    th {
      background-color: #21262d;
      color: var(--heading);
      font-weight: 600;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    tr:last-child td {
      border-bottom: none;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      padding: 0.2rem 0.6rem;
      border-radius: 20px;
      font-size: 0.8rem;
      font-weight: 600;
      text-transform: capitalize;
    }

    .status-frei { background-color: rgba(35, 134, 54, 0.2); color: #3fb950; border: 1px solid rgba(63, 185, 80, 0.3); }
    .status-belegt { background-color: rgba(218, 54, 51, 0.2); color: #f85149; border: 1px solid rgba(248, 81, 73, 0.3); }
    .status-vorgemerkt { background-color: rgba(158, 106, 3, 0.2); color: #d29922; border: 1px solid rgba(210, 153, 34, 0.3); }
  </style>
</head>
<body>

  <div class="container">
    <h1>Praktikumskalender</h1>
    <p class="subtitle">Aktuelle Übersicht der Schulwochen und Praktikumszeiten.</p>

    <div class="legend-container" id="legend"></div>

    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>SW</th>
            <th>KW</th>
            <th>Zeitraum</th>
            <th>Status</th>
            <th>Betrieb / Einrichtung</th>
          </tr>
        </thead>
        <tbody id="calendar-body">
          <tr>
            <td colspan="5" style="text-align: center; padding: 2rem;">Lade aktuelle Daten...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    function parseYAML(yamlString) {
      const lines = yamlString.split('\n');
      let legende = [];
      let termine = [];
      let currentSection = null;
      let currentItem = null;

      for (let line of lines) {
        const trimmed = line.trim();
        if (!trimmed || trimmed.startsWith('#')) continue;

        if (trimmed === 'legende:') {
          currentSection = 'legende';
          continue;
        } else if (trimmed === 'termine:') {
          if (currentItem && currentSection === 'legende') legende.push(currentItem);
          currentSection = 'termine';
          currentItem = null;
          continue;
        }

        if (trimmed.startsWith('- ')) {
          if (currentItem) {
            if (currentSection === 'legende') legende.push(currentItem);
            if (currentSection === 'termine') termine.push(currentItem);
          }
          currentItem = {};
          const firstProp = trimmed.substring(2).split(':');
          if (firstProp.length >= 2) {
            const key = firstProp[0].trim();
            const val = firstProp.slice(1).join(':').trim().replace(/^["']|["']$/g, '');
            currentItem[key] = val;
          }
        } else if (currentItem && trimmed.includes(':')) {
          const parts = trimmed.split(':');
          const key = parts[0].trim();
          const val = parts.slice(1).join(':').trim().replace(/^["']|["']$/g, '');
          currentItem[key] = val;
        }
      }

      if (currentItem) {
        if (currentSection === 'legende') legende.push(currentItem);
        if (currentSection === 'termine') termine.push(currentItem);
      }

      return { legende, termine };
    }

    function renderPage(legende, termine) {
      const legendContainer = document.getElementById('legend');
      legendContainer.innerHTML = legende.map(item => `
        <div class="legend-item">
          <span class="dot" style="background-color: ${item.farbe};"></span>
          <span>${item.label}</span>
        </div>
      `).join('');

      const tbody = document.getElementById('calendar-body');
      tbody.innerHTML = termine.map(t => `
        <tr>
          <td><strong>${t.sw}</strong></td>
          <td>${t.kw}</td>
          <td>${t.von} - ${t.bis}</td>
          <td><span class="badge status-${t.status}">${t.status}</span></td>
          <td>${t.betrieb || '-'}</td>
        </tr>
      `).join('');
    }

    let lastText = "";

    async function loadLiveData() {
      try {
        const res = await fetch("https://cdn.jsdelivr.net/gh/jstdrmabtit/jstdrmabtit.github.io@main/_data/meinedaten.yml?timestamp=" + new Date().getTime());
        if (!res.ok) return;

        const yamlText = await res.text();
        
        if (yamlText !== lastText) {
          lastText = yamlText;
          const parsed = parseYAML(yamlText);
          renderPage(parsed.legende, parsed.termine);
        }
      } catch (err) {
        console.error("Fehler beim automatischen Aktualisieren:", err);
      }
    }

    loadLiveData();
    setInterval(loadLiveData, 10000);
  </script>
</body>
</html>
