<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Praktikumskalender - Übersicht</title>
  <style>
    :root {
      --bg: #0d1117;
      --card-bg: #161b22;
      --border: #30363d;
      --text: #c9d1d9;
      --heading: #f0f6fc;
      --frei-bg: rgba(46, 160, 67, 0.15);
      --frei-text: #3fb950;
      --belegt-bg: rgba(248, 81, 73, 0.15);
      --belegt-text: #f85149;
      --vorgemerkt-bg: rgba(210, 153, 34, 0.15);
      --vorgemerkt-text: #d29922;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      margin: 0;
      padding: 2rem 1rem;
      display: flex;
      justify-content: center;
    }

    .container {
      max-width: 1000px;
      width: 100%;
    }

    h1 { color: var(--heading); margin-bottom: 0.5rem; }
    p.subtitle { color: #8b949e; margin-bottom: 2rem; }

    .legend-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1rem 1.5rem;
      margin-bottom: 1.5rem;
      display: flex;
      gap: 1.5rem;
      align-items: center;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      font-size: 0.9rem;
    }

    .dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      padding: 1.5rem;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
    }

    th, td {
      padding: 0.8rem;
      border-bottom: 1px solid var(--border);
    }

    th {
      color: #8b949e;
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    td { font-size: 0.9rem; }

    .badge {
      display: inline-block;
      padding: 0.25rem 0.6rem;
      border-radius: 12px;
      font-size: 0.75rem;
      font-weight: 600;
      text-transform: capitalize;
    }

    .badge-frei { background-color: var(--frei-bg); color: var(--frei-text); }
    .badge-belegt { background-color: var(--belegt-bg); color: var(--belegt-text); }
    .badge-vorgemerkt { background-color: var(--vorgemerkt-bg); color: var(--vorgemerkt-text); }
  </style>
</head>
<body>

  <div class="container">
    <h1>Praktikumskalender</h1>
    <p class="subtitle">Aktuelle Übersicht der Schulwochen und Praktikumszeiten.</p>

    <div class="legend-card" id="legend-container">
      <div class="legend-item"><span class="dot" style="background: #238636;"></span> Frei / Verfügbar</div>
      <div class="legend-item"><span class="dot" style="background: #da3633;"></span> Belegt</div>
      <div class="legend-item"><span class="dot" style="background: #d29922;"></span> Vorgemerkt</div>
    </div>

    <div class="card">
      <table>
        <thead>
          <tr>
            <th>SW</th>
            <th>KW</th>
            <th>ZEITRAUM</th>
            <th>STATUS</th>
            <th>BETRIEB / EINRICHTUNG</th>
          </tr>
        </thead>
        <tbody id="kalender-body">
          <tr>
            <td colspan="5" style="text-align: center; padding: 2rem;">Lade Kalenderdaten...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    function parseYAML(yamlString) {
      if (!yamlString || !yamlString.trim()) return { termine: [] };
      const lines = yamlString.replace(/\r\n/g, '\n').split('\n');
      let termine = [];
      let currentSection = null;
      let currentItem = null;

      for (let line of lines) {
        const trimmed = line.trim();
        if (!trimmed || trimmed.startsWith('#')) continue;

        if (trimmed === 'termine:') {
          if (currentItem && currentSection === 'termine') termine.push(currentItem);
          currentSection = 'termine';
          currentItem = null;
          continue;
        } else if (trimmed.endsWith(':') && !trimmed.startsWith('-')) {
          if (currentItem && currentSection === 'termine') termine.push(currentItem);
          currentSection = null;
          continue;
        }

        if (currentSection === 'termine') {
          if (trimmed.startsWith('- ')) {
            if (currentItem) termine.push(currentItem);
            currentItem = {};
            const rest = trimmed.substring(2).trim();
            const colonIdx = rest.indexOf(':');
            if (colonIdx !== -1) {
              const key = rest.substring(0, colonIdx).trim();
              const val = rest.substring(colonIdx + 1).trim().replace(/^["']|["']$/g, '');
              currentItem[key] = val;
            }
          } else if (currentItem && trimmed.includes(':')) {
            const colonIdx = trimmed.indexOf(':');
            const key = trimmed.substring(0, colonIdx).trim();
            const val = trimmed.substring(colonIdx + 1).trim().replace(/^["']|["']$/g, '');
            currentItem[key] = val;
          }
        }
      }
      if (currentItem && currentSection === 'termine') termine.push(currentItem);
      return { termine };
    }

    async function loadKalender() {
      const tbody = document.getElementById('kalender-body');
      try {
        const res = await fetch("https://raw.githubusercontent.com/jstdrmabtit/jstdrmabtit.github.io/main/_data/meinedaten.yml?t=" + Date.now());
        if (!res.ok) throw new Error("Konnte Daten nicht laden");

        const text = await res.text();
        const parsed = parseYAML(text);

        if (parsed.termine.length === 0) {
          tbody.innerHTML = `<tr><td colspan="5" style="text-align: center;">Keine Termine vorhanden.</td></tr>`;
          return;
        }

        tbody.innerHTML = parsed.termine.map(t => {
          const statusClass = t.status === 'belegt' ? 'badge-belegt' : (t.status === 'vorgemerkt' ? 'badge-vorgemerkt' : 'badge-frei');
          const betriebText = t.betrieb && t.betrieb.trim() !== '' ? t.betrieb : '-';
          return `
            <tr>
              <td><strong>${t.sw || ''}</strong></td>
              <td>${t.kw || ''}</td>
              <td>${t.von || ''} – ${t.bis || ''}</td>
              <td><span class="badge ${statusClass}">${t.status || 'frei'}</span></td>
              <td>${betriebText}</td>
            </tr>
          `;
        }).join('');
      } catch (err) {
        tbody.innerHTML = `<tr><td colspan="5" style="text-align: center; color: #f85149;">Fehler beim Laden der Daten.</td></tr>`;
      }
    }

    loadKalender();
  </script>
</body>
</html>
